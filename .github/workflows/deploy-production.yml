name: Deploy to Production
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy-production:
    name: Deploy production
    uses: AplinkosMinisterija/reusable-workflows/.github/workflows/biip-deploy.yml@main
    secrets: inherit
    permissions:
      contents: read
      packages: write
    with:
      environment: Production
      enable-sentry: true
      docker-image: ghcr.io/AplinkosMinisterija/biip-auth-api
      cache-from: type=registry,ref=ghcr.io/aplinkosministerija/biip-auth-api:buildcache
      cache-to: type=registry,ref=ghcr.io/aplinkosministerija/biip-auth-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
