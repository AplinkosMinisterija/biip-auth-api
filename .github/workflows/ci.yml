  validate:
    name: Validate node application
    runs-on: am-github-runner
    # ARC (Kubernetes) runner: the job runs inside a container and reaches
    # service containers by service name on their native port (postgres:5432,
    # redis:6379) — not localhost:<mapped-port> like a GitHub-hosted runner.
    container: node:18

    services:
      postgres:
        image: postgis/postgis:14-master
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: auth
          TZ: 'Etc/GMT'
          PGTZ: 'Etc/GMT'
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache --check-cache

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
        env:
          DB_CONNECTION: postgresql://postgres:postgres@postgres:5432/auth
          REDIS_CONNECTION: redis://redis:6379

  validate-docker-build:
    name: Validate if docker image builds
    runs-on: am-github-runner
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build & tag docker image
        uses: AplinkosMinisterija/reusable-workflows/.github/actions/docker-build-tag-push@main
        with:
          environment: test
          push: false
